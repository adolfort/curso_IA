<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <style>
    .box{fill:#fff;stroke:#333;stroke-width:2;rx:8;}
    .title{font:700 16px sans-serif;fill:#111}
    .label{font:400 13px sans-serif;fill:#111}
    .arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrowhead)}
    .bg{fill:#fcfdff}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  <rect width="100%" height="100%" class="bg" />

  <g transform="translate(60,40)">
    <!-- Header -->
    <rect x="0" y="0" width="360" height="70" rx="10" class="box" fill="#E3F2FD"/>
    <text x="20" y="30" class="title">Header — 🧠 Gestor de Tareas ICE</text>
    <text x="20" y="50" class="label">Botón ⚙ API Key (modal)</text>

    <!-- Main columns -->
    <rect x="0" y="120" width="360" height="220" rx="10" class="box" fill="#FFF3E0"/>
    <text x="20" y="150" class="title">Columna Izq</text>
    <text x="20" y="170" class="label">Formulario Nueva Tarea</text>

    <rect x="420" y="120" width="760" height="500" rx="10" class="box" fill="#E8F5E9"/>
    <text x="440" y="150" class="title">Columna Derecha</text>
    <text x="440" y="170" class="label">Lista de Tareas · Orden por ICE</text>

    <!-- Task Card -> actions -->
    <rect x="640" y="200" width="400" height="120" rx="8" fill="#fff" stroke="#bbb" />
    <text x="660" y="228" class="title">Tarjeta de Tarea</text>
    <text x="660" y="248" class="label">Estado · ICE · Botones (Calcular, Editar ICE, Eliminar)</text>

    <!-- Arrows to modals -->
    <path d="M320 50 L420 50" class="arrow" />
    <text x="350" y="40" class="label">Abrir API Key</text>

    <path d="M680 260 L880 260" class="arrow" />
    <text x="760" y="250" class="label">Acciones desde tarjeta</text>

    <!-- Modals -->
    <rect x="1200" y="80" width="320" height="140" rx="10" class="box" fill="#fff3f3"/>
    <text x="1220" y="110" class="title">ConfirmModal</text>
    <text x="1220" y="132" class="label">Eliminar · Marcar como hecha · Recalcular IA</text>

    <rect x="1200" y="260" width="320" height="140" rx="10" class="box" fill="#e8f7ff"/>
    <text x="1220" y="290" class="title">ApiKeyModal</text>
    <text x="1220" y="312" class="label">Guardar/Cambiar API Key</text>

    <rect x="1200" y="440" width="320" height="100" rx="10" class="box" fill="#fffde7"/>
    <text x="1220" y="470" class="title">Toast</text>
    <text x="1220" y="492" class="label">Mensajes success / error</text>

    <!-- connectors -->
    <path d="M1040 260 L1200 320" class="arrow" />
    <path d="M1040 320 L1200 420" class="arrow" />

    <!-- Legend -->
    <text x="0" y="360" class="label">Flujos principales:</text>
    <text x="0" y="380" class="label">- Header → ApiKeyModal</text>
    <text x="0" y="400" class="label">- Tarjeta → ConfirmModal (eliminar/hecha/recalcular)</text>
    <text x="0" y="420" class="label">- Acciones → Toast</text>
  </g>
</svg>